# Windows render proof.
#
# There is no Windows host on the maintainer's network, so this job is the only
# way to measure Windows behaviour of the PDF page renderer. It is deliberately
# workflow_dispatch only: Windows runners bill at a higher rate than Linux, and
# this repository batches pushes to control cost. Trigger it when Windows
# evidence is actually needed rather than on every push.
name: Windows render proof

on:
  workflow_dispatch:
    inputs:
      embedded_native_canvas:
        description: "Lift the embedded-host native canvas block (1 to lift)"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  render:
    name: render on windows-latest
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      # Baseline capability: does the native canvas binding load and render at
      # all on Windows, outside any embedded host?
      - name: Ordinary Node host render
        run: npx vitest run test/render-pdf-page.test.js

      # The question that matters for Claude Desktop on Windows. An embedded
      # Electron host has no macOS system renderer, so if the native canvas
      # block stays in force there is no renderer at all.
      - name: Embedded host render probe
        env:
          PDF_TOOLS_EMBEDDED_NATIVE_CANVAS: ${{ inputs.embedded_native_canvas }}
        run: node .github/workflows/windows-render-probe.mjs

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-render-probe
          path: windows-render-probe.json
          if-no-files-found: warn
